name: Eatinity CI, Security, and Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the reviewed production configuration
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: eatinity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  application-and-iac-checks:
    name: Application tests and Terraform validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: eatinity-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: eatinity-frontend
        run: npm ci

      - name: Lint frontend
        working-directory: eatinity-frontend
        run: npm run lint

      - name: Build frontend
        working-directory: eatinity-frontend
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install backend test dependencies
        run: python -m pip install boto3 stripe

      - name: Run backend unit tests
        working-directory: eatinity-backend
        run: python -m unittest discover -s tests -v

      - name: Build Lambda deployment packages
        shell: bash
        run: ./eatinity-backend/scripts/build_lambda_packages.sh

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive eatinity-iac

      - name: Validate production Terraform
        working-directory: eatinity-iac/environments/production
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate GitHub OIDC bootstrap Terraform
        working-directory: eatinity-iac/bootstrap/github-oidc
        run: |
          terraform init -backend=false
          terraform validate

  trivy:
    name: Trivy vulnerability, secret, dependency, and IaC scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run Trivy security gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

  sonarqube:
    name: SonarQube Community Edition analysis
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Windows, X64]
    environment: ci
    steps:
      - name: Check out repository with analysis history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify SonarQube configuration
        shell: powershell
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SONAR_HOST_URL)) {
            throw "SONAR_HOST_URL GitHub Environment variable is required"
          }
          if ([string]::IsNullOrWhiteSpace($env:SONAR_TOKEN)) {
            throw "SONAR_TOKEN GitHub Environment secret is required"
          }

      - name: Run SonarQube scan
        shell: powershell
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          $scannerVersion = "8.1.0.6389"
          $installRoot = Join-Path $env:RUNNER_TEMP "sonar-scanner-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $archivePath = Join-Path $env:RUNNER_TEMP "sonar-scanner-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.zip"
          $downloadUrl = "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-$scannerVersion-windows-x64.zip"

          Invoke-WebRequest -Uri $downloadUrl -OutFile $archivePath
          Expand-Archive -LiteralPath $archivePath -DestinationPath $installRoot

          $scannerHome = Join-Path $installRoot "sonar-scanner-$scannerVersion-windows-x64"
          $scanner = Join-Path $scannerHome "bin\sonar-scanner.bat"
          if (-not (Test-Path -LiteralPath $scanner)) {
            throw "SonarScanner executable was not found after extraction"
          }

          & $scanner
          if ($LASTEXITCODE -ne 0) {
            throw "SonarScanner failed with exit code $LASTEXITCODE"
          }

      - name: Enforce SonarQube Quality Gate
        shell: powershell
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          $reportPath = ".scannerwork\report-task.txt"
          if (-not (Test-Path -LiteralPath $reportPath)) {
            throw "SonarQube task report was not generated"
          }

          $report = @{}
          Get-Content -LiteralPath $reportPath | ForEach-Object {
            $parts = $_ -split "=", 2
            if ($parts.Count -eq 2) {
              $report[$parts[0]] = $parts[1]
            }
          }

          if ([string]::IsNullOrWhiteSpace($report["ceTaskId"])) {
            throw "SonarQube task ID is missing from the scan report"
          }

          $basicToken = [Convert]::ToBase64String(
            [Text.Encoding]::ASCII.GetBytes("${env:SONAR_TOKEN}:")
          )
          $headers = @{ Authorization = "Basic $basicToken" }
          $taskUrl = "$env:SONAR_HOST_URL/api/ce/task?id=$($report['ceTaskId'])"
          $analysisId = $null

          for ($attempt = 1; $attempt -le 150; $attempt++) {
            $taskResponse = Invoke-RestMethod -Uri $taskUrl -Headers $headers
            $taskStatus = $taskResponse.task.status
            Write-Host "SonarQube compute task status: $taskStatus"

            if ($taskStatus -eq "SUCCESS") {
              $analysisId = $taskResponse.task.analysisId
              break
            }
            if ($taskStatus -in @("FAILED", "CANCELED")) {
              throw "SonarQube compute task ended with status $taskStatus"
            }
            Start-Sleep -Seconds 2
          }

          if ([string]::IsNullOrWhiteSpace($analysisId)) {
            throw "Timed out waiting for the SonarQube compute task"
          }

          $gateUrl = "$env:SONAR_HOST_URL/api/qualitygates/project_status?analysisId=$analysisId"
          $gateResponse = Invoke-RestMethod -Uri $gateUrl -Headers $headers
          $gateStatus = $gateResponse.projectStatus.status
          Write-Host "SonarQube Quality Gate: $gateStatus"

          if ($gateStatus -ne "OK") {
            throw "SonarQube Quality Gate failed with status $gateStatus"
          }

  deploy:
    name: OIDC production deployment and smoke test
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}
    needs: [application-and-iac-checks, trivy, sonarqube]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_backup_operator_user_name: ${{ vars.BACKUP_OPERATOR_USER_NAME }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure short-lived AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify assumed AWS identity
        run: aws sts get-caller-identity

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: eatinity-frontend/package-lock.json

      - name: Install and build frontend
        working-directory: eatinity-frontend
        run: |
          npm ci
          npm run build

      - name: Build Lambda deployment packages
        shell: bash
        run: ./eatinity-backend/scripts/build_lambda_packages.sh

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Initialize remote state
        working-directory: eatinity-iac/environments/production
        run: terraform init -backend-config="bucket=${{ vars.TF_BACKEND_BUCKET }}" -backend-config="key=${{ vars.TF_BACKEND_KEY }}" -backend-config="region=${{ vars.AWS_REGION }}" -backend-config="encrypt=true"

      - name: Create reviewed deployment plan
        working-directory: eatinity-iac/environments/production
        run: terraform plan -out=eatinity.tfplan

      - name: Apply exact reviewed plan
        working-directory: eatinity-iac/environments/production
        run: terraform apply -auto-approve eatinity.tfplan

      - name: Publish frontend and invalidate CloudFront
        shell: bash
        run: |
          set -euo pipefail
          website_bucket=$(terraform -chdir=eatinity-iac/environments/production output -raw website_bucket_name)
          distribution_id=$(terraform -chdir=eatinity-iac/environments/production output -raw cloudfront_distribution_id)
          aws s3 sync eatinity-frontend/dist "s3://${website_bucket}" --delete
          aws cloudfront create-invalidation --distribution-id "$distribution_id" --paths '/*'

      - name: Smoke test deployed application and API
        shell: bash
        run: |
          set -euo pipefail
          frontend_url=$(terraform -chdir=eatinity-iac/environments/production output -raw frontend_base_url)
          products_url=$(terraform -chdir=eatinity-iac/environments/production output -raw products_api_url)
          curl --fail --retry 5 --retry-delay 10 "$frontend_url"
          curl --fail --retry 5 --retry-delay 10 "$products_url"
