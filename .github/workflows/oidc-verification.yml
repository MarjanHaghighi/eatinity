name: AWS OIDC Identity Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-oidc:
    name: Verify temporary AWS identity through OIDC
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Display non-secret OIDC claims
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const claims = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString('utf8')
            );
            for (const name of ['sub', 'aud', 'repository', 'ref', 'environment']) {
              core.info(`${name}: ${claims[name] ?? '(not present)'}`);
            }

      - name: Configure temporary AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ca-central-1
          retry-max-attempts: 2

      - name: Prove temporary AWS identity
        run: aws sts get-caller-identity

      - name: Confirm verification scope
        run: |
          echo "OIDC identity verification completed."
          echo "No Terraform plan/apply or AWS resource deployment was performed."
