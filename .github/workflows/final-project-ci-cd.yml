name: Eatinity CI, Security, and Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the reviewed production configuration
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: eatinity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  application-and-iac-checks:
    name: Application tests and Terraform validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: eatinity-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: eatinity-frontend
        run: npm ci

      - name: Lint frontend
        working-directory: eatinity-frontend
        run: npm run lint

      - name: Build frontend
        working-directory: eatinity-frontend
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install backend test dependencies
        run: python -m pip install boto3 stripe

      - name: Run backend unit tests
        working-directory: eatinity-prod
        run: python -m unittest discover -s tests -v

      - name: Build Lambda deployment packages
        shell: bash
        run: |
          set -euo pipefail
          for entry in \
            "products:get_products" \
            "admin_menu:admin_menu" \
            "admin_orders:admin_orders" \
            "admin_users:admin_users" \
            "sales_reports:sales_reports" \
            "admin_audit:admin_audit" \
            "stripe_checkout:stripe_checkout" \
            "stripe_webhook:stripe_webhook" \
            "user_profile:user_profile"; do
            folder="${entry%%:*}"
            archive="${entry##*:}"
            (cd "eatinity-prod/lambda/${folder}" && zip -qr "../${archive}.zip" . -x '*__pycache__*' '*.pyc')
          done

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive eatinity-iac

      - name: Validate production Terraform
        working-directory: eatinity-iac/environments/production
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate GitHub OIDC bootstrap Terraform
        working-directory: eatinity-iac/bootstrap/github-oidc
        run: |
          terraform init -backend=false
          terraform validate

  trivy:
    name: Trivy vulnerability, secret, dependency, and IaC scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run Trivy security gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

  sonarqube:
    name: SonarQube Community Edition analysis
    runs-on: ubuntu-latest
    environment: ci
    steps:
      - name: Check out repository with analysis history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify SonarQube configuration
        shell: bash
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          test -n "$SONAR_HOST_URL" || { echo "SONAR_HOST_URL GitHub Environment variable is required"; exit 1; }
          test -n "$SONAR_TOKEN" || { echo "SONAR_TOKEN GitHub Environment secret is required"; exit 1; }

      - name: Run SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: Enforce SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  deploy:
    name: OIDC production deployment and smoke test
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}
    needs: [application-and-iac-checks, trivy, sonarqube]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_backup_operator_user_name: ${{ vars.BACKUP_OPERATOR_USER_NAME }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure short-lived AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify assumed AWS identity
        run: aws sts get-caller-identity

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: eatinity-frontend/package-lock.json

      - name: Install and build frontend
        working-directory: eatinity-frontend
        run: |
          npm ci
          npm run build

      - name: Build Lambda deployment packages
        shell: bash
        run: |
          set -euo pipefail
          for entry in \
            "products:get_products" "admin_menu:admin_menu" "admin_orders:admin_orders" \
            "admin_users:admin_users" "sales_reports:sales_reports" "admin_audit:admin_audit" \
            "stripe_checkout:stripe_checkout" "stripe_webhook:stripe_webhook" "user_profile:user_profile"; do
            folder="${entry%%:*}"
            archive="${entry##*:}"
            (cd "eatinity-prod/lambda/${folder}" && zip -qr "../${archive}.zip" . -x '*__pycache__*' '*.pyc')
          done

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Initialize remote state
        working-directory: eatinity-iac/environments/production
        run: terraform init -backend-config="bucket=${{ vars.TF_BACKEND_BUCKET }}" -backend-config="key=${{ vars.TF_BACKEND_KEY }}" -backend-config="region=${{ vars.AWS_REGION }}" -backend-config="encrypt=true"

      - name: Create reviewed deployment plan
        working-directory: eatinity-iac/environments/production
        run: terraform plan -out=eatinity.tfplan

      - name: Apply exact reviewed plan
        working-directory: eatinity-iac/environments/production
        run: terraform apply -auto-approve eatinity.tfplan

      - name: Publish frontend and invalidate CloudFront
        shell: bash
        run: |
          set -euo pipefail
          website_bucket=$(terraform -chdir=eatinity-iac/environments/production output -raw website_bucket_name)
          distribution_id=$(terraform -chdir=eatinity-iac/environments/production output -raw cloudfront_distribution_id)
          aws s3 sync eatinity-frontend/dist "s3://${website_bucket}" --delete
          aws cloudfront create-invalidation --distribution-id "$distribution_id" --paths '/*'

      - name: Smoke test deployed application and API
        shell: bash
        run: |
          set -euo pipefail
          frontend_url=$(terraform -chdir=eatinity-iac/environments/production output -raw frontend_base_url)
          products_url=$(terraform -chdir=eatinity-iac/environments/production output -raw products_api_url)
          curl --fail --retry 5 --retry-delay 10 "$frontend_url"
          curl --fail --retry 5 --retry-delay 10 "$products_url"
